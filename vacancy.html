<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Вакансия · New.работа</title>
<meta name="description" content="Вакансия для молодёжи на New.работа: работа и подработка с 14 лет.">
<meta name="theme-color" content="#2F86F5">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>
<header class="mininav"><div class="wrap"><a class="home" href="./"><img src="logo.png" alt="">New.работа</a><a href="./">← Все вакансии</a></div></header>
<main class="wrap page" id="page">
  <p class="lead" id="loading">Загружаю вакансию…</p>
</main>
<footer class="foot"><div class="wrap"><span>© 2026 New.работа<span id="support"></span></span><span><a href="guide.html" style="color:var(--muted)">Гид подростку</a> · <a href="about.html" style="color:var(--muted)">О проекте</a></span></div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
(async function(){
  const {sb, el} = NR; const page=document.getElementById("page");
  const id=new URLSearchParams(location.search).get("id")||"";
  function fail(t){ page.textContent=""; const b=el("div","empty"); b.append(el("h3",null,t)); const a=el("a","btn btn-primary","Смотреть все вакансии"); a.href="./"; b.append(a); page.append(b) }
  if(!sb||!/^[0-9a-f-]{36}$/i.test(id)){fail("Вакансия не найдена");return}
  const base="id,created_at,title,company,city,type,age_min,pay,remote,description,contact";
  let {data,error}=await sb.from("vacancies").select(base+",verified,expires_at,employer_id").eq("id",id).eq("status","approved").maybeSingle();
  if(error)({data,error}=await sb.from("vacancies").select(base+",verified,expires_at").eq("id",id).eq("status","approved").maybeSingle());
  if(error)({data,error}=await sb.from("vacancies").select(base).eq("id",id).eq("status","approved").maybeSingle());
  if(!data){fail("Вакансия снята с публикации или не найдена");return}
  const v=data;
  const expired=v.expires_at&&v.expires_at<NR.today();
  document.title=v.title+(v.city?" — "+v.city:"")+" · New.работа";
  const md=document.querySelector('meta[name=description]'); md.content=(v.title+". "+(v.pay||"")+". С "+v.age_min+" лет. "+(v.description||"")).slice(0,180);

  page.textContent="";
  const box=el("article","vac");
  const tags=el("div","tags");
  if(v.verified)tags.append(el("span","t t-ok","✓ работодатель проверен"));
  tags.append(el("span","t t-age","с "+v.age_min+" лет"),el("span","t",v.type||"Подработка"));
  if(v.remote)tags.append(el("span","t t-remote","удалённо"));
  box.append(tags,el("h1",null,v.title));
  if(v.company)box.append(el("div","where",v.company));
  const kv=el("dl","kv");
  const row=(k,val)=>{if(!val)return;kv.append(el("dt",null,k),el("dd",null,val))};
  row("Оплата",v.pay||"по договорённости");
  row("Где",[v.city,v.remote?"можно удалённо":null].filter(Boolean).join(", "));
  row("Возраст","с "+v.age_min+" лет");
  row("Актуально",expired?"срок истёк":v.expires_at?NR.expiryText(v.expires_at):null);
  row("Опубликовано",new Date(v.created_at).toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"}));
  box.append(kv);
  if(v.description)box.append(el("p","desc",v.description));
  const ct=el("div","contact");ct.style.display="flex";ct.append(el("span","lbl","Отклик"),el("code",null,v.contact));box.append(ct);
  const act=el("div","actions");
  if(!expired){act.append(NR.respondButton(v));if(v.employer_id)act.append(NR.applyButton(v))}
  const share=el("button","fav","🔗 Скопировать ссылку");share.type="button";share.onclick=()=>NR.copy(location.href);
  const rep=el("button","subtle","Пожаловаться");rep.type="button";rep.style.marginLeft="auto";rep.onclick=()=>NR.reportDialog(v);
  act.append(share,rep);box.append(act);
  if(v.age_min<16)box.append(el("p","hint","Если тебе 14–15: понадобится согласие родителя и органа опеки. Как его оформить — в гиде подростку."));
  page.append(box);
  // подсказка по Трудовому кодексу для несовершеннолетних (ст. 63, 92, 94, 96, 265 ТК РФ)
  if((v.age_min||16)<18){
    const tk=el("section","panel");tk.style.marginTop="16px";
    const young=(v.age_min||16)<16;
    tk.append(el("h2",null,"⚖️ Если тебе меньше 18"));
    const ul=document.createElement("ul");ul.style.margin="6px 0 0";ul.style.paddingLeft="18px";
    [young?"14–15 лет: не больше 24 часов в неделю и 5 часов в день (в 14 лет — 4 часа); во время учёбы — не больше 2,5 часа в день.":null,
     "16–17 лет: не больше 35 часов в неделю и 7 часов в день; во время учёбы — не больше 4 часов в день.",
     "Нельзя: ночные смены (22:00–6:00), сверхурочные, выходные и праздники, тяжести и вредная работа.",
     young?"В 14–15 лет нужно письменное согласие родителя и органа опеки.":"Работодатель может попросить согласие родителя.",
     "Работа оформляется договором, оплата — не ниже, чем у взрослых за то же время работы."].filter(Boolean).forEach(t=>ul.append(el("li",null,t)));
    tk.append(ul);
    const p=el("p","hint");p.append(document.createTextNode("Ст. 63, 92, 94, 96, 265 Трудового кодекса. "));const a=el("a",null,"Бланк согласия родителя →");a.href="consent.html";p.append(a);tk.append(p);
    page.append(tk);
  }

  // разметка для поисковиков (Google и Яндекс понимают JobPosting)
  const ld={"@context":"https://schema.org","@type":"JobPosting",title:v.title,description:v.description||v.title,datePosted:v.created_at.slice(0,10),
    employmentType:{"Полная":"FULL_TIME","Частичная":"PART_TIME","Подработка":"PART_TIME","Стажировка":"INTERN","Разовая":"TEMPORARY","Волонтёрство":"VOLUNTEER"}[v.type]||"OTHER",
    hiringOrganization:{"@type":"Organization",name:v.company||"Работодатель New.работа"},
    jobLocation:v.city?{"@type":"Place",address:{"@type":"PostalAddress",addressLocality:v.city,addressCountry:"RU"}}:undefined,
    jobLocationType:v.remote?"TELECOMMUTE":undefined, applicantLocationRequirements:v.remote?{"@type":"Country",name:"Россия"}:undefined};
  if(v.expires_at)ld.validThrough=v.expires_at+"T23:59:59+03:00";
  const s=document.createElement("script");s.type="application/ld+json";s.textContent=JSON.stringify(ld);document.head.append(s);

  // отзывы о работодателе
  if(v.company){
    const rv=el("section","panel");rv.style.marginTop="16px";page.append(rv);
    const head=el("h2",null,"Отзывы о «"+v.company+"»");head.style.marginTop="0";rv.append(head);
    const body=el("div");rv.append(body);
    const {data:rs,error:re}=await sb.from("reviews").select("rating,body,author,created_at").ilike("company",v.company.replace(/[%_]/g,"")).eq("status","approved").order("created_at",{ascending:false}).limit(20);
    if(!re){
      if(rs&&rs.length){const avg=rs.reduce((s,x)=>s+x.rating,0)/rs.length;body.append(el("p",null,"★ "+avg.toFixed(1)+" из 5 · "+rs.length+" отзыв"+(rs.length===1?"":rs.length<5?"а":"ов")));
        rs.forEach(x=>{const d=el("div","rev");d.append(el("span","stars","★★★★★".slice(0,x.rating)+"☆☆☆☆☆".slice(0,5-x.rating)),document.createTextNode(" "+(x.author||"Аноним")+" · "+new Date(x.created_at).toLocaleDateString("ru-RU",{month:"long",year:"numeric"})),el("p",null,x.body));body.append(d)})}
      else body.append(el("p","hint","Отзывов пока нет. Работал(а) здесь? Расскажи другим — это защищает от недобросовестных работодателей."));
      const btn=el("button","btn btn-ghost btn-sm","✍ Оставить отзыв");btn.type="button";btn.style.marginTop="10px";rv.append(btn);
      btn.onclick=()=>{
        const sh=el("div","sheet"),f=el("form","form");f.noValidate=true;
        f.append(el("h2",null,"Отзыв о «"+v.company+"»"),el("p","hint full","Пиши честно и по делу: условия, оплата, отношение. Отзыв появится после проверки модератором."));
        const sel=document.createElement("select");[5,4,3,2,1].forEach(n=>{const o=el("option",null,"★".repeat(n)+" — "+["","ужасно","плохо","нормально","хорошо","отлично"][n]);o.value=n;sel.append(o)});
        const fld=(lab,node,full)=>{const d=el("div","field"+(full?" full":""));d.append(el("label",null,lab),node);f.append(d)};
        fld("Оценка",sel);const nm=document.createElement("input");nm.maxLength=40;nm.placeholder="Можно не указывать";fld("Имя",nm);
        const ta=document.createElement("textarea");ta.maxLength=1500;ta.placeholder="Что понравилось, что нет, платили ли вовремя";fld("Отзыв",ta,true);
        const err=el("p","err");err.hidden=true;f.append(err);
        const row=el("div","row");const c=el("button","btn btn-ghost","Отмена");c.type="button";c.onclick=()=>sh.remove();const s=el("button","btn btn-primary","Отправить");s.type="submit";row.append(c,s);f.append(row);
        f.addEventListener("submit",async e=>{e.preventDefault();if(ta.value.trim().length<10){err.textContent="Напиши хотя бы пару предложений.";err.hidden=false;return}
          s.disabled=true;const {error}=await sb.from("reviews").insert({company:v.company,rating:+sel.value,body:ta.value.trim(),author:nm.value.trim()||null,status:"pending"});s.disabled=false;
          if(error){err.textContent="Не получилось отправить.";err.hidden=false;return}sh.remove();NR.toast("Спасибо! Отзыв появится после проверки")});
        sh.append(f);document.body.append(sh);sh.addEventListener("click",x=>{if(x.target===sh)sh.remove()});
      };
    } else rv.remove();
  }

  // похожие
  let q=sb.from("vacancies").select("id,title,pay,city,age_min,remote").eq("status","approved").neq("id",v.id).order("created_at",{ascending:false}).limit(4);
  q=v.city?q.eq("city",v.city):q.eq("remote",true);
  const {data:sim}=await q;
  if(sim&&sim.length){const h=el("h2",null,v.city?"Ещё вакансии: "+v.city:"Ещё на удалёнке");page.append(h);const l=el("div","list");sim.forEach(x=>{const a=el("a","mini");a.href="vacancy.html?id="+x.id;a.append(el("b",null,x.title),el("span",null,[x.pay||"по договорённости","с "+x.age_min+" лет"].join(" · ")));l.append(a)});page.append(l)}
})();
</script>
</body>
</html>
