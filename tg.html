<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>New.работа — мини-приложение</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/png" href="favicon.png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Цвета берутся из темы Telegram (светлая/тёмная), снаружи Telegram — свои */
:root{
  --bg:var(--tg-theme-bg-color,#fff);--bg2:var(--tg-theme-secondary-bg-color,#f1f4f9);
  --tx:var(--tg-theme-text-color,#17202e);--hint:var(--tg-theme-hint-color,#76808f);
  --link:var(--tg-theme-link-color,#2F86F5);--btn:var(--tg-theme-button-color,#2F86F5);
  --btx:var(--tg-theme-button-text-color,#fff);--card:var(--tg-theme-section-bg-color,var(--bg));
  --sep:color-mix(in srgb,var(--hint) 25%,transparent);
}
@media (prefers-color-scheme:dark){:root:not(.tg){--bg:#17212b;--bg2:#0e1621;--tx:#f5f5f5;--hint:#8a97a6;--card:#17212b}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg2);color:var(--tx);font:15px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 12px 8px;border-bottom:1px solid var(--sep)}
.row{display:flex;gap:8px}
.in{flex:1;min-width:0;border:0;border-radius:10px;background:var(--bg2);padding:9px 12px;outline:none}
.in::placeholder{color:var(--hint)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-top:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--sep);background:transparent;border-radius:16px;padding:5px 11px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--btn);color:var(--btx);border-color:var(--btn)}
.status{color:var(--hint);font-size:13px;padding:8px 14px 0}
.list{padding:8px 10px 90px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border-radius:14px;padding:12px 14px;cursor:pointer}
.card h3{margin:0 0 2px;font-size:16px;line-height:1.3}
.where{color:var(--hint);font-size:13px}
.pay{font-weight:600;margin-top:4px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.t{font-size:12px;border-radius:8px;padding:2px 7px;background:var(--bg2);color:var(--hint)}
.t.ok{color:#1f9d55}.t.pin{color:#d97706}
.empty{text-align:center;color:var(--hint);padding:40px 20px}
.detail{padding:12px 14px 100px;background:var(--bg);min-height:100vh}
.detail h2{margin:4px 0;font-size:20px;line-height:1.25}
.detail .desc{white-space:pre-wrap;margin:12px 0}
.box{background:var(--bg2);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}
.box b{display:block;margin-bottom:4px}
.box ul{margin:4px 0 0;padding-left:18px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:12px;margin-top:8px;background:var(--btn);color:var(--btx);font-weight:600;cursor:pointer;text-align:center;text-decoration:none}
.btn.ghost{background:var(--bg2);color:var(--link)}
.foot{text-align:center;color:var(--hint);font-size:13px;padding:6px 0 20px}
.foot a{color:var(--link)}
.fld{margin:10px 0}
.fld label{display:block;font-size:13px;color:var(--hint);margin-bottom:4px}
.fld .in{width:100%;display:block}
textarea.in{min-height:84px;resize:vertical;font:inherit}
.radio{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--sep);font-size:15px}
.radio input{margin-top:3px;accent-color:var(--btn)}
.err{color:#e5484d;font-size:14px;margin:8px 0}
.note{color:var(--hint);font-size:13px;margin:6px 0 0}
.toast{position:fixed;left:12px;right:12px;bottom:18px;z-index:20;background:var(--tx);color:var(--bg);border-radius:12px;padding:11px 14px;text-align:center;font-size:14px}
.goal{background:var(--card);border-radius:14px;padding:10px 14px;cursor:pointer}
.goal .gt{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.goal .gt span:last-child{color:var(--hint);white-space:nowrap}
.bar{height:8px;border-radius:4px;background:var(--bg2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--btn);border-radius:4px}
.t.pig{color:var(--link)}
.qa{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.qa .chip{font-size:13px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="listView">
  <div class="top">
    <div class="row">
      <input class="in" id="q" type="search" placeholder="Курьер, кафе, промоутер…" enterkeyhint="search">
      <input class="in" id="city" type="text" placeholder="Город" style="max-width:38%">
    </div>
    <div class="chips" id="chips"></div>
  </div>
  <div class="status" id="status">Загружаю вакансии…</div>
  <div class="list" id="list"></div>
  <div class="foot">Работодатель? <a href="#" id="addLink">Разместить вакансию</a> · <a href="#" id="siteLink">Сайт</a></div>
</div>
<div id="detailView" class="detail" hidden></div>
<div id="formView" class="detail" hidden></div>

<script src="vendor/supabase.js?v=1"></script>
<script src="config.js?v=2"></script>
<script src="common.js?v=2"></script>
<script src="piggy.js"></script>
<script>
(function(){
  const tg=window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initData!==undefined?Telegram.WebApp:null;
  const inTg=!!(tg&&tg.platform&&tg.platform!=="unknown");
  if(inTg){document.documentElement.classList.add("tg");tg.ready();tg.expand();try{tg.setHeaderColor("bg_color");tg.setBackgroundColor("secondary_bg_color")}catch(_){}}
  const {sb,el,today}=window.NR;
  const SITE=new URL(".",location.href).href;
  const $=s=>document.getElementById(s);
  const norm=s=>(s||"").toString().toLowerCase().replace(/ё/g,"е").trim();
  const haptic=t=>{try{tg&&tg.HapticFeedback.selectionChanged()}catch(_){}};
  const buzz=k=>{try{tg&&tg.HapticFeedback.notificationOccurred(k)}catch(_){}};
  const tgUser=(inTg&&tg.initDataUnsafe&&tg.initDataUnsafe.user)||null;

  // ── хранилище: облако Telegram (видно на всех устройствах человека), иначе браузер ──
  const store={
    get(k){return new Promise(res=>{
      if(inTg&&tg.CloudStorage&&tg.isVersionAtLeast&&tg.isVersionAtLeast("6.9")){try{tg.CloudStorage.getItem(k,(e,v)=>res(e?null:v||null));return}catch(_){}}
      try{res(localStorage.getItem("nr-tg-"+k))}catch(_){res(null)}})},
    set(k,v){
      if(inTg&&tg.CloudStorage&&tg.isVersionAtLeast&&tg.isVersionAtLeast("6.9")){try{tg.CloudStorage.setItem(k,v,()=>{})}catch(_){}}
      try{localStorage.setItem("nr-tg-"+k,v)}catch(_){}}
  };

  const S={items:[],q:"",city:"",age:0,remote:false,fav:false,favs:new Set(),ready:false,profile:{},applied:new Set(),goal:null};
  const P=window.Piggy||null;
  const rub=n=>Math.round(n).toLocaleString("ru-RU")+" ₽";
  const AGES=[14,15,16,17,18];

  function chips(){
    const c=$("chips");c.textContent="";
    const add=(label,on,fn)=>{const b=el("button","chip"+(on?" on":""),label);b.type="button";b.onclick=()=>{haptic();fn();save();chips();render()};c.append(b)};
    AGES.forEach(a=>add(a===18?"мне 18+":"мне "+a,S.age===a,()=>S.age=S.age===a?0:a));
    add("🏠 Удалённо",S.remote,()=>S.remote=!S.remote);
    add("★ Избранное"+(S.favs.size?" "+S.favs.size:""),S.fav,()=>S.fav=!S.fav);
    if(P&&!S.goal){const b=el("button","chip","🐷 Копилка");b.type="button";b.onclick=()=>goalView();c.append(b)}
  }
  function save(){store.set("age",String(S.age||""));store.set("city",S.city);store.set("remote",S.remote?"1":"");store.set("favs",[...S.favs].slice(-80).join(","))}

  function filtered(){
    const q=norm(S.q),c=norm(S.city);
    return S.items.filter(v=>{
      if(S.fav&&!S.favs.has(String(v.id)))return false;
      if(S.age&&(+v.age_min||14)>S.age)return false;
      if(S.remote&&!v.remote)return false;
      if(c&&!v.remote&&!norm(v.city).includes(c))return false;
      if(q){const h=norm([v.title,v.company,v.description,v.city,v.type].join(" "));if(!q.split(/\s+/).every(w=>h.includes(w)))return false}
      return true;
    }).sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0));
  }
  const word=n=>{const m=n%10,h=n%100;return n+" "+(m===1&&h!==11?"вакансия":m>=2&&m<=4&&(h<12||h>14)?"вакансии":"вакансий")};

  function tags(v){
    const t=el("div","tags");
    if(v.pinned)t.append(el("span","t pin","📌 закреплена"));
    if(v.verified)t.append(el("span","t ok","✓ проверен"));
    t.append(el("span","t","с "+(v.age_min||14)+" лет"),el("span","t",v.type||"Подработка"));
    if(v.remote)t.append(el("span","t","удалённо"));
    if(v.expires_at)t.append(el("span","t",NR.expiryText(v.expires_at)));
    const g=P&&S.goal&&P.toGoal(v.pay,S.goal);
    if(g&&g.text)t.append(el("span","t pig","🐷 "+g.text));
    return t;
  }
  function render(){
    const list=$("list");list.textContent="";
    if(!S.ready)return;
    const items=filtered();
    if(P&&S.goal)list.append(goalBanner());
    $("status").textContent=S.items.length?word(items.length)+(S.city?" · "+S.city:""):"";
    if(!items.length){
      const e=el("div","empty");
      e.append(el("div",null,S.items.length?"Ничего не нашлось. Убери часть фильтров или попробуй другой город.":"Вакансий пока нет — загляни позже."));
      list.append(e);return;
    }
    items.slice(0,200).forEach(v=>{
      const c=el("div","card");
      c.append(el("h3",null,v.title||"Без названия"),el("div","where",[v.company,v.remote&&!v.city?"Удалённо":v.city].filter(Boolean).join(" · ")),el("div","pay",v.pay||"по договорённости"),tags(v));
      c.onclick=()=>open(v);
      list.append(c);
    });
  }

  // ── подсказка по ТК РФ для 14–17 лет ──
  function lawBox(v){
    const a=+v.age_min||14; if(a>=18)return null;
    const b=el("div","box");b.append(el("b",null,"⚖️ Если тебе 14–17 лет (ТК РФ)"));
    const ul=el("ul");
    ["С 14 лет — лёгкая работа в свободное от учёбы время, с письменного согласия родителя (ст. 63).",
     "В неделю: до 16 лет — не больше 24 ч, 16–17 лет — не больше 35 ч (ст. 92).",
     "В день: 14–15 лет — до 4 ч, 15–16 — до 5 ч, 16–17 — до 7 ч; в дни учёбы — до 2,5 ч (до 16 лет) и до 4 ч (16–17) (ст. 94).",
     "Нельзя: ночью с 22 до 6, сверхурочно, в выходные и в командировках (ст. 96, 268), на вредной и опасной работе (ст. 265)."
    ].forEach(s=>ul.append(el("li",null,s)));
    b.append(ul);
    const l=el("a",null,"Согласие родителей — бланк");l.href="#";l.style.color="var(--link)";l.onclick=e=>{e.preventDefault();go(SITE+"consent.html")};
    b.append(l);return b;
  }
  /** После анкеты: по желанию кружок-визитка — бот перешлёт его только работодателю этой вакансии. */
  async function videoOffer(code){
    if(!/^[a-f0-9]{8,32}$/.test(String(code)))return;
    let bot="";try{const r=await sb.from("settings").select("data").eq("id",1).maybeSingle();const d=(r.data&&r.data.data)||{};if(!d.video_card)return;bot=String(d.bot_username||"").replace(/^@/,"").trim()}catch(_){}
    if(!/^[A-Za-z0-9_]{4,40}$/.test(bot))return;
    const url="https://t.me/"+bot+"?start=vv_"+code, q="📹 Добавить кружок-визитку? Запиши в боте кружок до минуты — он уйдёт только работодателю этой вакансии. Это по желанию.";
    if(inTg&&tg.showConfirm)tg.showConfirm(q,ok=>{if(ok)go(url)}); else if(confirm(q))go(url);
  }
  function go(url){
    if(inTg){ if(/^https:\/\/t\.me\//.test(url))tg.openTelegramLink(url); else tg.openLink(url) }
    else window.open(url,"_blank","noopener");
  }
  function respond(v){
    const c=NR.contactLink(v.contact);
    if(sb&&v.id)sb.rpc("vacancy_click",{vid:v.id}).then(()=>{},()=>{});
    if(c.href&&/^https|^mailto/.test(c.href))go(c.href);
    else if(c.href&&c.href.startsWith("tel:"))location.href=c.href;
    if(c.copy)NR.copy(c.copy);
  }

  // ── 🐷 Копилка на цель: «на что коплю» → сколько смен/часов на каждой вакансии (piggy.js) ──
  function saveGoal(){store.set("goal",S.goal?JSON.stringify(S.goal):"")}
  function goalBanner(){
    const g=S.goal,pct=Math.min(100,Math.round(g.have/g.need*100));
    const b=el("div","goal");const t=el("div","gt");
    t.append(el("span",null,"🐷 "+g.name),el("span",null,g.have>=g.need?"✓ собрано!":rub(g.have)+" из "+rub(g.need)));
    const bar=el("div","bar"),i=document.createElement("i");i.style.width=pct+"%";bar.append(i);
    b.append(t,bar);b.onclick=()=>goalView();return b;
  }
  function piggyBox(v){
    if(!P||!S.goal)return null;
    const g=P.toGoal(v.pay,S.goal);if(!g)return null;
    const b=el("div","box");b.append(el("b",null,"🐷 Копилка «"+S.goal.name+"»"));
    if(g.done){b.append(el("div",null,"Цель уже собрана — поздравляем! Можно поставить новую."));return b}
    const left=S.goal.need-S.goal.have;
    let s="До цели "+rub(left)+": здесь это "+g.text+" (по нижней ставке "+rub(g.rate.amount)+")";
    if(g.unit==="hour"){const a=S.age||(+v.age_min||14);const day=a<15?4:a<16?5:a<18?7:8;const dd=Math.ceil(g.n/day);s+=" — примерно "+dd+" "+(dd%10===1&&dd%100!==11?"рабочий день":dd%10>=2&&dd%10<=4&&(dd%100<12||dd%100>14)?"рабочих дня":"рабочих дней")+" по "+day+" ч"}
    b.append(el("div",null,s+". Это прикидка: из зарплаты могут удержать налог 13%, а точную сумму скажет работодатель."));
    return b;
  }
  function goalView(){
    haptic();mode="goal";
    const f=$("formView");f.textContent="";
    if(!inTg){const bb=el("button","btn ghost","← Назад");bb.type="button";bb.onclick=back;f.append(bb)}
    const g=S.goal||{name:"",need:"",have:""};
    f.append(el("h2",null,"🐷 Копилка на цель"),el("div","note","Напиши, на что копишь, — у каждой вакансии появится, сколько смен или часов нужно до цели. Хранится только у тебя в Telegram."));
    const name=field(f,"На что коплю",input(g.name,40,"Наушники, велосипед, поездка…"));
    const need=field(f,"Сколько нужно, ₽",input(g.need,8,"6000","numeric"));
    const have=field(f,"Уже есть, ₽",input(g.have,8,"0","numeric"));
    if(S.goal){
      const qa=el("div","qa");f.append(el("div","note","Заработал — добавь в копилку:"),qa);
      [500,1000,2000].forEach(n=>{const b=el("button","chip","+"+rub(n));b.type="button";b.onclick=()=>{have.value=String((parseInt(have.value.replace(/\D/g,""),10)||0)+n);haptic()};qa.append(b)});
    }
    const showErr=finish(f,null,"Сохранить");
    if(S.goal){const del=el("button","btn ghost","Убрать копилку");del.type="button";del.style.color="#e5484d";
      del.onclick=()=>{S.goal=null;saveGoal();mode=null;submit=null;chips();close();render();toast("Копилка убрана")};f.append(del)}
    $("detailView").hidden=true;$("listView").hidden=true;f.hidden=false;window.scrollTo(0,0);
    if(inTg){tg.BackButton.show();tg.MainButton.setText("Сохранить");tg.MainButton.show()}
    submit=()=>{
      const n=parseInt(need.value.replace(/\D/g,""),10)||0,h=parseInt(have.value.replace(/\D/g,""),10)||0;
      if(!name.value.trim())return showErr("Напиши, на что копишь.");
      if(n<100)return showErr("Укажи сумму цели — от 100 ₽.");
      const ng=P.cleanGoal({name:name.value,need:n,have:h});if(!ng)return showErr("Проверь сумму.");
      const was=S.goal&&S.goal.have<S.goal.need;
      S.goal=ng;saveGoal();buzz("success");
      const v=cur;mode=null;submit=null;$("formView").hidden=true;chips();
      if(v)open(v);else{close();render()}
      toast(ng.have>=ng.need?(was?"🎉 Цель собрана! Ты молодец.":"Копилка сохранена"):"Копилка сохранена: осталось "+rub(ng.need-ng.have));
    };
  }

  let cur=null;
  function open(v){
    cur=v;haptic();
    const d=$("detailView");d.textContent="";
    d.append(el("h2",null,v.title||"Без названия"),el("div","where",[v.company,v.remote&&!v.city?"Удалённо":v.city].filter(Boolean).join(" · ")),el("div","pay",v.pay||"по договорённости"),tags(v));
    if(v.description)d.append(el("div","desc",v.description));
    const ct=el("div","box");ct.append(el("b",null,"Как откликнуться"),el("div",null,v.contact||"контакт не указан"));d.append(ct);
    const law=lawBox(v);if(law)d.append(law);
    const pg=piggyBox(v);if(pg)d.append(pg);
    const sh=el("div","box");sh.append(el("b",null,"🛡 Осторожно"),el("div",null,"Честный работодатель не просит денег за обучение или форму, не просит оформить на себя карту или сим-карту и не платит «только наличными курьером». Сомневаешься — нажми «Пожаловаться» внизу."));d.append(sh);
    const fav=S.favs.has(String(v.id));
    const bf=el("button","btn ghost",fav?"★ В избранном":"☆ В избранное");bf.type="button";
    bf.onclick=()=>{const id=String(v.id);S.favs.has(id)?S.favs.delete(id):S.favs.add(id);save();chips();open(v)};
    const bs=el("button","btn ghost","↗ Поделиться с другом");bs.type="button";
    bs.onclick=()=>go("https://t.me/share/url?url="+encodeURIComponent(SITE+"vacancy.html?id="+v.id)+"&text="+encodeURIComponent(v.title||""));
    if(v.employer_id){
      const sent=S.applied.has(String(v.id));
      const ba=el("button","btn"+(sent?" ghost":""),sent?"✓ Анкета отправлена":"📝 Отправить анкету");ba.type="button";
      ba.onclick=()=>applyView(v);d.append(ba);
      if(!sent)d.append(el("div","note","Анкета придёт работодателю в кабинет и в Telegram — он ответит по твоему контакту."));
    }
    const bw=el("button","btn ghost","Открыть на сайте");bw.type="button";
    bw.onclick=()=>go(SITE+"vacancy.html?id="+encodeURIComponent(v.id));
    const br=el("button","btn ghost","⚠️ Пожаловаться");br.type="button";br.style.color="#e5484d";
    br.onclick=()=>reportView(v);
    d.append(bf,bs,bw,br);
    if(!inTg){const br=el("button","btn","✉ Откликнуться");br.type="button";br.onclick=()=>respond(v);d.prepend(br);const bb=el("button","btn ghost","← Назад");bb.type="button";bb.onclick=close;d.prepend(bb)}
    $("listView").hidden=true;d.hidden=false;window.scrollTo(0,0);
    $("formView").hidden=true;
    if(inTg){tg.BackButton.show();tg.MainButton.setText("✉ Откликнуться");tg.MainButton.show()}
  }
  function close(){
    cur=null;mode=null;$("detailView").hidden=true;$("formView").hidden=true;$("listView").hidden=false;
    if(inTg){tg.BackButton.hide();tg.MainButton.hide()}
  }

  // ── анкета и жалоба прямо в мини-приложении (без перехода на сайт) ──
  let mode=null,submit=null,busy=false;
  function toast(t){let e=$("toast");if(!e){e=el("div","toast");e.id="toast";document.body.append(e)}e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,3200)}
  function back(){ if(mode&&cur){const v=cur;mode=null;submit=null;$("formView").hidden=true;open(v)} else close() }
  function setBusy(b,label){busy=b;if(inTg){try{b?tg.MainButton.showProgress(false):tg.MainButton.hideProgress()}catch(_){}}const s=$("fSend");if(s){s.disabled=b;if(label)s.textContent=label}}
  function formShell(v,title,hint,sendLabel){
    const f=$("formView");f.textContent="";
    if(!inTg){const bb=el("button","btn ghost","← Назад");bb.type="button";bb.onclick=back;f.append(bb)}
    f.append(el("h2",null,title),el("div","where","«"+(v.title||"")+"»"+(v.company?" · "+v.company:"")));
    if(hint)f.append(el("div","note",hint));
    $("detailView").hidden=true;$("listView").hidden=true;f.hidden=false;window.scrollTo(0,0);
    if(inTg){tg.BackButton.show();tg.MainButton.setText(sendLabel);tg.MainButton.show()}
    return f;
  }
  function field(f,label,node){const d=el("div","fld");d.append(el("label",null,label),node);f.append(d);return node}
  function input(val,max,ph,mode2){const i=document.createElement("input");i.className="in";i.type="text";i.maxLength=max;i.value=val||"";if(ph)i.placeholder=ph;if(mode2)i.inputMode=mode2;return i}
  function finish(f,err,send){const e=el("div","err");e.hidden=true;f.append(e);
    if(!inTg){const b=el("button","btn",send);b.type="button";b.id="fSend";b.onclick=()=>submit&&submit();f.append(b)}
    return t=>{e.textContent=t;e.hidden=!t;if(t){buzz("error");e.scrollIntoView({block:"nearest"})}}}

  function applyView(v){
    if(!sb){toast("Мини-приложение не подключено к базе");return}
    haptic();mode="apply";
    const p=S.profile||{};
    const f=formShell(v,"📝 Анкета","Работодатель увидит её в кабинете и получит уведомление в Telegram.","Отправить анкету");
    const name=field(f,"Имя",input(p.name||(tgUser&&tgUser.first_name)||"",60,"Как к тебе обращаться"));
    const age=field(f,"Возраст",input(p.age||(S.age&&S.age<18?S.age:""),2,"16","numeric"));
    const contact=field(f,"Контакт для ответа",input(p.contact||(tgUser&&tgUser.username?"@"+tgUser.username:""),120,"@telegram или телефон"));
    const msg=document.createElement("textarea");msg.className="in";msg.maxLength=600;msg.placeholder="Пара слов о себе: когда можешь работать, опыт";msg.value=p.about||"";field(f,"О себе",msg);
    const showErr=finish(f,null,"Отправить анкету");
    submit=async()=>{
      if(busy)return;
      const a=parseInt(age.value,10),nm=name.value.trim(),ct=contact.value.trim();
      if(nm.length<2||ct.length<3)return showErr("Укажи имя и контакт, чтобы работодатель мог ответить.");
      if(a&&(a<14||a>99))return showErr("Проверь возраст.");
      if(a&&a<(+v.age_min||14))return showErr("На эту вакансию берут с "+(+v.age_min||14)+" лет.");
      showErr("");setBusy(true,"Отправляю…");
      const args={vid:v.id,p_name:nm,p_age:a||null,p_contact:ct,p_message:msg.value.trim()};
      let error=null,vcode=null;try{({data:vcode,error}=await sb.rpc("apply_v",args));if(error&&/function|schema/.test(String(error.message||""))){vcode=null;({error}=await sb.rpc("apply",args))}}catch(e){error=e}
      setBusy(false,"Отправить анкету");
      if(error){const m=String(error.message||"");return showErr(/closed/.test(m)?"Вакансия уже закрыта.":/too many/.test(m)?"Сейчас много анкет — попробуй через 10 минут.":/function|schema/.test(m)?"Анкеты скоро заработают. Пока откликнись по контакту.":"Не получилось отправить. Проверь интернет и попробуй ещё раз.")}
      S.profile={name:nm,age:a||"",contact:ct,about:msg.value.trim().slice(0,600)};store.set("profile",JSON.stringify(S.profile));
      S.applied.add(String(v.id));store.set("applied",[...S.applied].slice(-60).join(","));
      buzz("success");mode=null;submit=null;$("formView").hidden=true;open(v);toast("Анкета отправлена! Работодатель свяжется с тобой.");
      if(vcode)videoOffer(vcode);
    };
  }

  const REASONS=["Мошенничество, дропы, «лёгкие деньги»","Просят заплатить за обучение или форму","Не подходит для подростков","Контакты не работают","Другое"];
  function reportView(v){
    if(!sb){toast("Мини-приложение не подключено к базе");return}
    haptic();mode="report";
    const f=formShell(v,"⚠️ Пожаловаться","Модератор проверит и уберёт вакансию, если что-то не так. Твоё имя не передаётся.","Отправить жалобу");
    const box=el("div","fld");
    REASONS.forEach((r,i)=>{const l=el("label","radio");const inp=document.createElement("input");inp.type="radio";inp.name="rr";inp.value=r;if(i===0)inp.checked=true;l.append(inp,el("span",null,r));box.append(l)});
    f.append(box);
    const ta=document.createElement("textarea");ta.className="in";ta.maxLength=400;ta.placeholder="Подробности (необязательно)";field(f,"Что случилось",ta);
    const showErr=finish(f,null,"Отправить жалобу");
    submit=async()=>{
      if(busy)return;
      const r=(f.querySelector("input[name=rr]:checked")||{}).value||"Другое";
      if(r==="Другое"&&ta.value.trim().length<3)return showErr("Напиши пару слов, что не так.");
      const reason=(r+(ta.value.trim()?": "+ta.value.trim():"")).slice(0,500);
      showErr("");setBusy(true,"Отправляю…");
      let error=null;try{({error}=await sb.from("reports").insert({vacancy_id:v.id,reason}))}catch(e){error=e}
      setBusy(false,"Отправить жалобу");
      if(error)return showErr("Не получилось отправить. Попробуй позже.");
      buzz("success");mode=null;submit=null;$("formView").hidden=true;open(v);toast("Спасибо! Жалоба у модератора.");
    };
  }

  if(inTg){tg.BackButton.onClick(back);tg.MainButton.onClick(()=>{if(mode&&submit)submit();else if(cur)respond(cur)})}

  let qt;$("q").oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{S.q=e.target.value;render()},200)};
  $("city").onchange=e=>{S.city=e.target.value.trim();save();render()};
  $("city").oninput=e=>{clearTimeout(qt);qt=setTimeout(()=>{S.city=e.target.value.trim();render()},300)};
  $("addLink").onclick=e=>{e.preventDefault();go(SITE+"#add")};
  $("siteLink").onclick=e=>{e.preventDefault();go(SITE)};

  async function load(){
    const [age,city,remote,favs,profile,applied,goal]=await Promise.all(["age","city","remote","favs","profile","applied","goal"].map(k=>store.get(k)));
    S.age=+age||0;S.remote=remote==="1";S.favs=new Set((favs||"").split(",").filter(Boolean));
    try{S.profile=JSON.parse(profile||"{}")||{}}catch(_){S.profile={}}
    S.applied=new Set((applied||"").split(",").filter(Boolean));
    try{S.goal=P&&goal?P.cleanGoal(JSON.parse(goal)):null}catch(_){S.goal=null}
    // город из ссылки бота: t.me/бот?startapp=city_Москва или tg.html?city=…
    const sp=(inTg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param)||"";
    const urlCity=new URLSearchParams(location.search).get("city")||(sp.startsWith("city_")?decodeURIComponent(sp.slice(5)).replace(/_/g," "):"");
    S.city=urlCity||city||"";$("city").value=S.city;
    chips();
    if(!sb){S.ready=true;$("status").textContent="Сайт не подключён к базе";return}
    const base="id,created_at,title,company,city,type,age_min,pay,remote,description,contact";
    const q=cols=>sb.from("vacancies").select(cols).eq("status","approved").or("expires_at.is.null,expires_at.gte."+today()).order("created_at",{ascending:false}).limit(500);
    let {data,error}=await q(base+",pinned,pinned_until,verified,expires_at,employer_id");
    if(error)({data,error}=await q(base+",pinned,verified,expires_at"));
    if(error)({data,error}=await sb.from("vacancies").select(base).eq("status","approved").order("created_at",{ascending:false}).limit(500));
    S.ready=true;
    if(error){$("status").textContent="Вакансии сейчас недоступны. Попробуй позже.";return}
    S.items=(data||[]).map(v=>{if(v.pinned&&v.pinned_until&&new Date(v.pinned_until)<new Date())v.pinned=false;return v});
    render();
    // открыть конкретную вакансию: startapp=v_<id>
    if(sp.startsWith("v_")){const v=S.items.find(x=>String(x.id)===sp.slice(2));if(v)open(v)}
  }
  load();
})();
</script>
</body>
</html>
