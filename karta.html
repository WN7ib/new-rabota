<style>
html,body{height:100%;overflow:hidden}
body{margin:0;-webkit-tap-highlight-color:transparent}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .leaflet-tile-pane{filter:invert(92%) hue-rotate(190deg) brightness(88%) contrast(105%) saturate(80%)}}

.glass{background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);box-shadow:0 8px 28px rgb(6 18 40 / .18);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;z-index:20;display:grid;gap:8px;pointer-events:none}
.bar{pointer-events:auto;display:flex;align-items:center;gap:8px;border-radius:18px;padding:7px}
.bar img.klogo{width:34px;height:34px;border-radius:11px;flex:none}
.bar input{flex:1;min-width:0;border:0;background:transparent;padding:6px 2px;font:500 15px var(--f-body);color:var(--ink);outline:none}
.bar input::placeholder{color:var(--muted)}
.sq{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;font-size:16px;cursor:pointer;flex:none}
.lvl{border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);border-radius:12px;padding:7px 10px;font:700 12px var(--f-body);white-space:nowrap;cursor:pointer}
.chips{pointer-events:auto;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 2px}
.chips::-webkit-scrollbar{display:none}
.chips .chip{flex:none;box-shadow:0 4px 14px rgb(6 18 40 / .12)}

.rail{position:fixed;right:12px;top:calc(max(10px,env(safe-area-inset-top)) + 112px);z-index:18;display:grid;gap:8px;justify-items:center}
.rail .sq{width:42px;height:42px;font-size:18px;font-weight:700}
.nevi{width:62px;height:66px;border-radius:18px;border:1.5px solid color-mix(in srgb,var(--accent) 55%,transparent);display:grid;place-items:center;padding:4px 4px 2px;cursor:pointer;background:var(--surface)}
.nevi img{width:44px;height:44px;display:block}
.nevi b{font:800 9px var(--f-body);letter-spacing:.08em;color:var(--accent)}
.nevi.talk{animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{to{box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 25%,transparent)}}

.ksheet{position:fixed;left:0;right:0;bottom:0;z-index:25;border-radius:24px 24px 0 0;border-bottom:0;padding:6px 16px calc(14px + env(safe-area-inset-bottom));max-height:56dvh;overflow-y:auto;transition:max-height .25s ease;overscroll-behavior:contain}
.ksheet.min{max-height:64px;overflow:hidden}
.grip{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:4px 0 10px;cursor:pointer}
.grip i{width:40px;height:5px;border-radius:9px;background:var(--line);display:block}
.grip .r{justify-self:end}
.pill{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:4px 10px;font:600 12px var(--f-body);cursor:pointer}
.ttl{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ttl h2{margin:0;font:800 18px/1.25 var(--f-head,var(--f-body));font-family:"Unbounded",var(--f-body);letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px;margin-top:3px}
.star{flex:none;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:6px 10px;font:800 13px var(--f-body)}
.item span.star{color:var(--accent-ink)}.item span.star.none{color:var(--muted)}.item span.star.bad{color:#fff}
a.btn{text-decoration:none}
.star.bad{background:var(--danger);color:#fff}.star.none{background:var(--chip);color:var(--muted)}
.ktags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tg{font:600 12px var(--f-body);padding:4px 9px;border-radius:9px;background:var(--chip);color:var(--accent)}
.tg.good{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.stat{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 10px}
.stat small{display:block;color:var(--muted);font-size:11px}.stat b{font-size:14px}
.cta{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:8px;margin:4px 0 12px}
.cta .btn{padding:11px 6px;font-size:13.5px;justify-content:center;border-radius:12px}
.sec{font:700 13px var(--f-body);color:var(--muted);margin:12px 0 8px;display:flex;justify-content:space-between}
.item{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:block;color:var(--ink);text-decoration:none}
.item b{display:block}.item span{color:var(--muted);font-size:13px}
.rv .h{display:flex;justify-content:space-between;font:700 12.5px var(--f-body);margin-bottom:3px}.rv .h span{color:var(--accent)}
.rv p{margin:0;font-size:13.5px;line-height:1.4}
.klist .item{display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer}
.step{display:flex;gap:10px;align-items:flex-start}.step em{flex:none;font-style:normal;width:24px;height:24px;border-radius:8px;background:var(--chip);color:var(--accent);display:grid;place-items:center;font:800 12px var(--f-body)}
.kmodes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.mode{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px;text-align:center;cursor:pointer;color:var(--ink)}
.mode b{display:block;font-size:15px}.mode small{color:var(--muted)}
.mode[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.mode[aria-pressed="true"] small{color:inherit;opacity:.85}

.ov{position:fixed;inset:0;z-index:40;background:rgb(4 11 22 / .55);backdrop-filter:blur(3px);display:none;align-items:flex-end}
.ov.on{display:flex}
.dr{width:100%;max-height:86dvh;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;border-top:1px solid var(--line);padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.dh h3{margin:0;font:800 17px "Unbounded",var(--f-body)}
.who{display:flex;gap:12px;align-items:center}.who img{width:64px;height:64px}
.bubble{border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.5;margin-bottom:10px}
.track{height:9px;border-radius:9px;background:var(--chip);overflow:hidden;margin:8px 0 4px}.track i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--good));border-radius:9px;transition:width .3s}
.week{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.week span{border:1px solid var(--line);border-radius:12px;padding:8px 0;text-align:center;font:700 12px var(--f-body);color:var(--muted)}
.week span.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:4px;margin:12px 0}
.tabs button{border:0;background:none;border-radius:10px;padding:8px;font:700 13px var(--f-body);color:var(--muted);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.q{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:11px 12px;margin-bottom:8px}
.q .h{display:flex;justify-content:space-between;gap:8px;font-weight:700}.q .h span{color:var(--accent);white-space:nowrap}
.q small{color:var(--muted)}
.ach{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ach div{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:10px}.ach div.lock{opacity:.5}
.ach small{display:block;color:var(--muted);font-size:12px}
.fld{margin-bottom:10px}.fld label{display:block;font:600 12px var(--f-body);color:var(--muted);margin-bottom:4px}
.rate{display:flex;gap:6px}.rate button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 0;font-size:17px;cursor:pointer;color:var(--muted)}.rate button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.pin{transform:translate(-50%,-100%);display:inline-flex;align-items:center;gap:4px;white-space:nowrap;border-radius:12px;padding:4px 9px;font:800 12px var(--f-body);color:#fff;background:var(--accent);border:2px solid #fff;box-shadow:0 5px 14px rgb(6 18 40 / .35)}
.pin.ev{background:var(--good)}.pin.city{background:#7c4dff;font-size:13px;padding:6px 11px}.pin.sel{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent)}
.mepin{width:18px;height:18px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 30%,transparent)}
@media (min-width:760px){.ksheet{left:12px;right:auto;width:420px;bottom:12px;border-radius:24px;border-bottom:1px solid var(--line)}.dr{max-width:520px;margin:0 auto;border-radius:24px 24px 0 0}}
</style>

<div class="hud">
  <div class="bar glass">

<script>
(function(){
  const {sb}=NR, $=s=>document.querySelector(s);
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const word=(n,a,b,c)=>n%10===1&&n%100!==11?a:n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?b:c;
  const fmt=d=>new Date(d).toLocaleString("ru-RU",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});
  const SAR=[51.5331,46.0342];   // центр Саратова (Театральная площадь)
  const isSar=c=>/саратов/i.test(String(c||""));
  Mascot.mount();
  // ── внутри Telegram (кнопка меню бота): во весь экран, тема Telegram, кнопка «назад» ──
  const tg=window.Telegram&&Telegram.WebApp&&Telegram.WebApp.platform&&Telegram.WebApp.platform!=="unknown"?Telegram.WebApp:null;
  const haptic=()=>{try{tg&&tg.HapticFeedback.selectionChanged()}catch(_){}};
  if(tg){tg.ready();tg.expand();try{tg.disableVerticalSwipes&&tg.disableVerticalSwipes()}catch(_){}
    if(!localStorage.getItem("nr-theme"))document.documentElement.setAttribute("data-theme",tg.colorScheme==="dark"?"dark":"light");
    try{tg.setHeaderColor(tg.colorScheme==="dark"?"#0B1424":"#EEF4FC")}catch(_){}
    tg.BackButton.onClick(()=>{if(document.getElementById("ov").classList.contains("on"))document.getElementById("ov").classList.remove("on");else{const h=window.__home;h&&h()}syncBack()});
  }
  function syncBack(){if(!tg)return;const busy=document.getElementById("ov").classList.contains("on")||window.__sel;busy?tg.BackButton.show():tg.BackButton.hide()}
  // ── «как приложение»: установка на главный экран ──
  let installEv=null;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEv=e});
  const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone||/NewRabotaApp/.test(navigator.userAgent);
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
  async function install(){
    if(installEv){installEv.prompt();const r=await installEv.userChoice;installEv=null;NR.toast(r.outcome==="accepted"?"Готово! Ищи New.работа на главном экране":"Можно установить позже");return}
    if(tg){try{tg.addToHomeScreen?tg.addToHomeScreen():tg.openLink(location.href.split("?")[0])}catch(_){tg.openLink(location.href.split("?")[0])}return}
    const ua=navigator.userAgent,box=document.getElementById("nb"),say=t=>{if(box){box.innerHTML=t;Mascot.flash("think",1200)}else NR.toast(t.replace(/<[^>]+>/g,""))};
    if(/iPhone|iPad|iPod/.test(ua)){say(/CriOS|FxiOS|Telegram/.test(ua)?"На iPhone значок ставится только из <b>Safari</b>: открой эту страницу в Safari → кнопка «Поделиться» ⬆ → <b>«На экран Домой»</b>.":"Нажми внизу «Поделиться» ⬆ → <b>«На экран Домой»</b> → «Добавить». Значок New.работа появится на рабочем столе.");return}
    if(/Android/.test(ua)){
      // окно внутри Telegram/другого приложения установку не умеет — открываю ту же страницу в Chrome
      const inApp=/wv\)|; wv|Telegram|Instagram|VKClient|FBAN|FBAV/.test(ua)||!/Chrome\/|SamsungBrowser/.test(ua);
      if(inApp){location.href="intent://"+location.host+location.pathname+"#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url="+encodeURIComponent(location.href)+";end";return}
      say(/SamsungBrowser/.test(ua)?"Нажми внизу меню ☰ → <b>«Добавить страницу на»</b> → <b>«Главный экран»</b>.":"Нажми ⋮ вверху справа → <b>«Добавить на главный экран»</b> (или «Установить приложение») → «Установить».");return}
    say("В браузере на компьютере: значок ⊕ в адресной строке → «Установить».");
  }

  // ── прогресс (только на этом телефоне) ──
  const PK="nr-karta-prog";
  const wk=()=>{const d=new Date(),j=new Date(d.getFullYear(),0,1);return d.getFullYear()+"-"+Math.ceil(((d-j)/864e5+j.getDay()+1)/7)};
  let P={xp:0,pts:0,week:wk(),shifts:0,done:{},routes:0,reviews:0,voice:0,opened:{}};
  try{Object.assign(P,JSON.parse(localStorage.getItem(PK)||"{}"))}catch(e){}
  if(P.week!==wk()){P.week=wk();P.shifts=0;delete P.done.week}
  const save=()=>{try{localStorage.setItem(PK,JSON.stringify(P))}catch(e){}};
  const lvl=()=>1+Math.floor(P.xp/100);
  const hud=()=>{$("#lvl").textContent="Ур. "+lvl()+" · "+P.pts+" очк."};
  const QUESTS=[
    {id:"week",t:"Ритм недели: 5 смен",d:"Отмечай смены кнопкой «+ Смена»",pts:3,xp:60,ok:()=>P.shifts>=5,prog:()=>[P.shifts,5]},
    {id:"route",t:"Точно вовремя",d:"Построй маршрут до смены",pts:1,xp:20,ok:()=>P.routes>=1,prog:()=>[Math.min(P.routes,1),1]},
    {id:"voice",t:"Голосовой напарник",d:"Попроси Неви прочитать карточку вслух",pts:1,xp:15,ok:()=>P.voice>=1,prog:()=>[Math.min(P.voice,1),1]},
    {id:"review",t:"Честный разбор",d:"Оставь отзыв о работодателе (после проверки он появится у всех)",pts:2,xp:35,ok:()=>P.reviews>=1,prog:()=>[Math.min(P.reviews,1),1]},
    {id:"scout",t:"Разведчик",d:"Открой 5 разных мест на карте",pts:1,xp:20,ok:()=>Object.keys(P.opened).length>=5,prog:()=>[Math.min(Object.keys(P.opened).length,5),5]}
  ];
  const ACH=[["Первая смена","Отметить смену",()=>P.shifts>=1||P.done.week],["5 смен за неделю","Закрыть ритм недели",()=>!!P.done.week],["Знаю дорогу","Построить маршрут",()=>P.routes>=1],["Голос команды","Оставить отзыв",()=>P.reviews>=1],["Разведчик Саратова","5 мест на карте",()=>Object.keys(P.opened).length>=5],["Уровень 3","Набрать 200 опыта",()=>lvl()>=3]];
  function bump(k){P[k]=(P[k]||0)+1;P.xp+=5;save();hud()}

  // ── тема ──
  $("#themeBtn").onclick=()=>{const r=document.documentElement,dark=r.getAttribute("data-theme")==="dark"||(!r.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme: dark)").matches);r.setAttribute("data-theme",dark?"light":"dark");try{localStorage.setItem("nr-theme",dark?"light":"dark")}catch(e){};NR.toast(dark?"Светлая тема":"Тёмная тема")};

  // ── карта ──
  const map=L.map("map",{zoomControl:false,attributionControl:true}).setView(SAR,13);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
  $("#zin").onclick=()=>map.zoomIn();$("#zout").onclick=()=>map.zoomOut();
  const layer=L.layerGroup().addTo(map);let line=null,meMark=null,me=null;

  // ── данные ──
  let EV=[],VAC=[],RV={},filter="all",sel=null,routeMode="foot";
  const key=s=>String(s||"").toLowerCase().replace(/ё/g,"е").replace(/[«»"']/g,"").replace(/\s+/g," ").trim();
  function companyRating(name){const r=RV[key(name)];if(!r||!r.length)return null;return (r.reduce((a,x)=>a+x.rating,0)/r.length)}
  function companies(){const m={};for(const v of VAC){const k=key(v.company)||"__"+v.id;(m[k]=m[k]||{kind:"co",id:"co:"+k,name:v.company||v.title,vac:[]}).vac.push(v)}return Object.values(m)}
  function pass(o){
    const q=key($("#q").value);
    if(q&&!key([o.name,o.title,o.place,o.kind,...(o.vac||[]).map(v=>v.title+" "+v.type)].join(" ")).includes(q))return false;
    if(filter==="ev")return o.kind==="ev";
    if(filter==="vac")return o.kind==="co";
    if(filter==="14")return o.kind==="co"?o.vac.some(v=>v.age_min<=14):false;
    if(filter==="good"){const r=companyRating(o.kind==="co"?o.name:"");return r!=null&&r>=4}

  // ── маршрут: от тебя (или от центра) — время примерное, точный путь — в Яндекс Картах ──
  function km(a,b){const r=Math.PI/180,d1=(b[0]-a[0])*r,d2=(b[1]-a[1])*r,x=Math.sin(d1/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(d2/2)**2;return 6371*2*Math.asin(Math.sqrt(x))}
  function closeRoute(redraw){if(line){map.removeLayer(line);line=null}if(redraw&&sel)open(sel)}
  function route(o){
    bump("routes");const from=me||SAR,to=[o.lat,o.lng],d=Math.max(.3,km(from,to)*1.3);
    const t={foot:Math.round(d*12)+2,bus:Math.round(d*4)+8,car:Math.round(d*2.5)+4};
    if(line)map.removeLayer(line);
    line=L.polyline([from,to],{color:getComputedStyle(document.documentElement).getPropertyValue("--accent").trim()||"#2F86F5",weight:5,opacity:.9,dashArray:"2 10",lineCap:"round"}).addTo(map);
    map.fitBounds(line.getBounds(),{padding:[90,60]});
    const draw=()=>{C.innerHTML=`<div class="ttl"><div><h2>≈ ${t[routeMode]} мин · ${d.toFixed(1)} км</h2><div class="sub">${me?"От тебя":"От центра Саратова (нажми ➤, чтобы от тебя)"} до «${esc(o.title)}»</div></div><button class="pill" id="x">✕</button></div>
      <div class="kmodes">${[["foot","Пешком"],["bus","Автобус"],["car","Такси"]].map(([k,n])=>`<button class="mode" data-m="${k}" aria-pressed="${k===routeMode}"><b>${t[k]} мин</b><small>${n}</small></button>`).join("")}</div>
      <div class="item step"><em>1</em><span>Открой точный маршрут — с остановками и пересадками.</span></div>
      <div class="item step"><em>2</em><span>Выходи заранее: на смену лучше прийти за 10 минут.</span></div>
      <div class="item step"><em>3</em><span>${esc(o.place||"Адрес")} — на месте спроси старшего смены.</span></div>
      <div class="cta" style="grid-template-columns:1.4fr 1fr"><a class="btn btn-primary" target="_blank" rel="noopener" href="${NRGeo.route(o.lat,o.lng)}">Точный маршрут ↗</a><button class="btn btn-ghost" id="vc">🔊 Озвучить</button></div>
      <div class="note">Время примерное (по прямой). Точный путь строят Яндекс Карты.</div>`;
      C.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{routeMode=b.dataset.m;draw()});
      $("#x").onclick=()=>closeRoute(true);$("#vc").onclick=()=>speak(`До «${o.title}» примерно ${t[routeMode]} минут, ${d.toFixed(1)} километра. Выходи заранее, удачной смены!`)};
    draw();
  }

    navigator.geolocation.getCurrentPosition(p=>{me=[p.coords.latitude,p.coords.longitude];if(meMark)meMark.remove();meMark=L.marker(me,{icon:L.divIcon({className:"",html:'<div class="mepin"></div>',iconSize:[18,18]})}).addTo(map);map.setView(me,15);NR.toast("Ты здесь")},()=>NR.toast("Разреши доступ к месту, чтобы считать путь от тебя"),{timeout:12000,maximumAge:600000});
  };

    const tree=[["Голос",1,"Неви читает карточки вслух"],["Маршруты",2,"Подсказки в дороге"],["Разведка",3,"Больше советов по работодателям"],["Наставник",5,"Разбор твоих смен за неделю"]].map(([n,l,d])=>`<div class="q" style="${lvl()>=l?"":"opacity:.55"}"><div class="h">${lvl()>=l?"✦":"🔒"} ${n}<span>ур. ${l}</span></div><small>${d}</small></div>`).join("");

    const today=NR.today();
    let v=await sb.from("vacancies").select("id,title,company,city,type,age_min,pay,remote,verified,weekend,expires_at").eq("status","approved").order("created_at",{ascending:false}).limit(500);
    if(v.error)v=await sb.from("vacancies").select("id,title,company,city,type,age_min,pay,remote").eq("status","approved").limit(500);
    const allV=(v.data||[]).filter(x=>!x.expires_at||x.expires_at>=today);
    VAC=allV.filter(x=>isSar(x.city)&&!x.remote);
    if(!VAC.length)VAC=allV;   // в Саратове пока пусто — не показываю «0», а все вакансии (с городом/удалёнкой в строке)
    let e=await sb.from("events").select("id,title,starts_at,place,city,kind,description,capacity,listed,lat,lng").gte("starts_at",new Date().toISOString()).order("starts_at").limit(300);
    EV=(e.data||[]).filter(x=>x.listed!==false&&x.lat!=null&&x.lng!=null).map(x=>({...x,evkind:x.kind,kind:"ev"}));
    const r=await sb.from("reviews").select("company,rating,body,author,created_at").eq("status","approved").order("created_at",{ascending:false}).limit(1000);
    for(const x of r.data||[])(RV[key(x.company)]=RV[key(x.company)]||[]).push(x);
    draw();home();
    if(EV.length){const b=L.latLngBounds(EV.map(x=>[x.lat,x.lng]).concat([SAR]));map.fitBounds(b,{padding:[120,60],maxZoom:14})}
    const want=(location.search.match(/[?&]e=([0-9a-f-]{36})/)||[])[1];if(want)open(EV.find(x=>x.id===want));
  })();
})();
</script>
