<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Карта вакансий и смен · New.работа</title>
<meta name="description" content="Карта вакансий, смен и мероприятий для молодёжи от 14 лет: что есть рядом с тобой, по городам России.">
<meta name="theme-color" content="#2F86F5">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css?v=7">
<style>
#map{height:min(62vh,560px);border-radius:var(--r);border:1px solid var(--line);margin-top:14px;z-index:0}
.pin{background:var(--accent);color:var(--accent-ink);border-radius:999px;font:600 13px var(--f-body);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 8px rgb(0 0 0 / .3)}
.leaflet-popup-content{font:14px var(--f-body);margin:12px 14px}
.leaflet-popup-content a.mini{margin-top:6px}
.cities,.tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.pin.ev{background:var(--good);color:#fff}
.me{width:18px;height:18px;border-radius:50%;background:var(--danger);border:3px solid #fff;box-shadow:0 0 0 2px var(--danger)}
.near{margin-top:14px;display:grid;gap:8px}
.near a{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);text-decoration:none}
.near small{color:var(--muted)}
</style>
</head>
<body>
<header class="mininav"><div class="wrap"><a class="home" href="./"><img src="logo.png" alt="">New.работа</a><a href="./">Списком →</a></div></header>
<main class="wrap page wide">
  <h1>Карта вакансий и смен</h1>
  <p class="lead" id="sum">Загружаю вакансии…</p>
  <div class="tools" id="tools">
    <button class="chip" type="button" data-show="all" aria-pressed="true">всё</button>
    <button class="chip" type="button" data-show="vac" aria-pressed="false">вакансии</button>
    <button class="chip" type="button" data-show="ev" aria-pressed="false">смены и мероприятия</button>
    <button class="chip" type="button" id="nearBtn">📍 Рядом со мной</button>
  </div>
  <div class="near" id="near" hidden></div>
  <div id="map" role="region" aria-label="Карта вакансий и смен"></div>
  <div class="cities" id="cities"></div>
</main>
<footer class="foot"><div class="wrap"><span>© 2026 New.работа<span id="support"></span></span><span>Карта © участники OpenStreetMap</span></div></footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
(function(){
  const {sb,el}=NR;
  // координаты городов (широта, долгота)
  const C={"саратов":[51.533,46.034],"энгельс":[51.485,46.126],"балаково":[52.03,47.80],"вольск":[52.045,47.374],"балашов":[51.553,43.163],"маркс":[51.71,46.75],"ртищево":[52.26,43.79],"аткарск":[51.87,45.0],"пугачёв":[52.015,48.80],"пугачев":[52.015,48.80],"красноармейск":[51.02,45.70],"петровск":[52.31,45.39],"хвалынск":[52.49,48.10],"ершов":[51.35,48.28],"калининск":[51.50,44.47],"новоузенск":[50.46,48.14],
  "москва":[55.756,37.617],"санкт-петербург":[59.939,30.316],"питер":[59.939,30.316],"самара":[53.195,50.101],"тольятти":[53.508,49.42],"волгоград":[48.708,44.513],"казань":[55.796,49.106],"нижний новгород":[56.327,44.006],"екатеринбург":[56.838,60.597],"новосибирск":[55.008,82.935],"краснодар":[45.035,38.975],"ростов-на-дону":[47.222,39.718],"воронеж":[51.672,39.184],"пенза":[53.195,45.018],"уфа":[54.735,55.958],"пермь":[58.01,56.25],"челябинск":[55.16,61.40],"тюмень":[57.153,65.534],"красноярск":[56.01,92.852],"омск":[54.989,73.368],"ульяновск":[54.314,48.403],"оренбург":[51.768,55.097],"тамбов":[52.721,41.452],"липецк":[52.603,39.57],"астрахань":[46.348,48.033],"ярославль":[57.626,39.894],"тула":[54.193,37.617],"рязань":[54.629,39.736],"курск":[51.73,36.193],"белгород":[50.595,36.587],"калининград":[54.71,20.51],"сочи":[43.585,39.72],"иркутск":[52.287,104.305],"хабаровск":[48.48,135.07],"владивосток":[43.115,131.885],"сызрань":[53.155,48.475],"ижевск":[56.852,53.204],"чебоксары":[56.146,47.251],"киров":[58.603,49.668],"набережные челны":[55.743,52.396],"махачкала":[42.983,47.504],"ставрополь":[45.044,41.969],"томск":[56.484,84.948],"барнаул":[53.348,83.78],"кемерово":[55.355,86.087],"саранск":[54.187,45.184],"йошкар-ола":[56.634,47.9],"брянск":[53.243,34.364],"смоленск":[54.782,32.045],"тверь":[56.859,35.912],"иваново":[57.0,40.973],"владимир":[56.129,40.407],"калуга":[54.513,36.261],"орёл":[52.97,36.064],"орел":[52.97,36.064],"мурманск":[68.97,33.075],"архангельск":[64.54,40.54],"вологда":[59.22,39.89],"петрозаводск":[61.79,34.39],"сургут":[61.25,73.42],"якутск":[62.03,129.73]};
  const norm=s=>String(s||"").toLowerCase().replace(/^г\.?\s*/,"").replace(/ё/g,"ё").trim();
  const hasMap=typeof L!=="undefined";
  const map=hasMap?L.map("map",{scrollWheelZoom:false}).setView([52.5,47],5):null;
  if(hasMap)L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:17,attribution:"© OpenStreetMap"}).addTo(map);
  else document.getElementById("map").hidden=true;
  const word=(n,a,b,c)=>n%10===1&&n%100!==11?a:n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?b:c;
  const coord=k=>C[k]||C[k.split(/[ ,(]/)[0]];
  // расстояние по прямой, км
  const km=(a,b)=>{const r=Math.PI/180,d1=(b[0]-a[0])*r,d2=(b[1]-a[1])*r,x=Math.sin(d1/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(d2/2)**2;return 6371*2*Math.asin(Math.sqrt(x))};
  const fmt=d=>new Date(d).toLocaleString("ru-RU",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"});
  const by={};let remote=0,unknown=0,show="all",me=null;
  const group=c=>{const k=norm(c);return by[k]=by[k]||{key:k,name:c,vac:[],ev:[],c:coord(k)}};
  const layerV=hasMap?L.layerGroup().addTo(map):null,layerE=hasMap?L.layerGroup().addTo(map):null;
  function box(g,what){
    const d=document.createElement("div");
    if(what==="vac"){
      const n=g.vac.length;d.append(el("b",null,g.name+": "+n+" "+word(n,"вакансия","вакансии","вакансий")));
      g.vac.slice(0,6).forEach(v=>{const a=el("a","mini");a.href="vacancy.html?id="+v.id;a.append(el("b",null,v.title),el("span",null,[v.pay||"по договорённости","с "+v.age_min+" лет"].join(" · ")));d.append(a)});
      if(n>6){const a=el("a",null,"Все вакансии города →");a.href="./?city="+encodeURIComponent(g.name);d.append(a)}
    }else{
      const n=g.ev.length;d.append(el("b",null,g.name+": "+n+" "+word(n,"смена или событие","смены и события","смен и событий")));
      g.ev.slice(0,6).forEach(e=>{const a=el("a","mini");a.href="events.html#e-"+e.id;a.append(el("b",null,e.title),el("span",null,[e.kind,fmt(e.starts_at),e.place].filter(Boolean).join(" · ")));d.append(a)});
      if(n>6){const a=el("a",null,"Все мероприятия →");a.href="events.html";d.append(a)}
    }
    return d;
  }
  function pin(g,what){
    const n=g[what].length,sz=Math.min(54,26+n*3),c=what==="ev"&&g.vac.length&&show==="all"?[g.c[0]-0.04,g.c[1]+0.06]:g.c;
    return L.marker(c,{icon:L.divIcon({className:"",html:'<div class="pin'+(what==="ev"?" ev":"")+'" style="width:'+sz+'px;height:'+sz+'px">'+n+'</div>',iconSize:[sz,sz]}),title:g.name}).bindPopup(box(g,what));
  }
  function draw(){
    if(!hasMap)return;
    layerV.clearLayers();layerE.clearLayers();
    for(const g of Object.values(by)){if(!g.c)continue;
      if(show!=="ev"&&g.vac.length)pin(g,"vac").addTo(layerV);
      if(show!=="vac"&&g.ev.length)pin(g,"ev").addTo(layerE)}
  }
  function fit(){
    if(!hasMap)return;
    const pts=Object.values(by).filter(g=>g.c&&(show!=="ev"&&g.vac.length||show!=="vac"&&g.ev.length)).map(g=>g.c);
    if(me){const near=pts.slice().sort((a,b)=>km(me,a)-km(me,b)).slice(0,3);map.fitBounds([me,...near],{padding:[40,40],maxZoom:10});return}
    if(pts.length>1)map.fitBounds(pts,{padding:[40,40],maxZoom:8});else if(pts.length===1)map.setView(pts[0],9);
  }
  function nearList(){
    const box=document.getElementById("near");box.textContent="";box.hidden=false;
    const gs=Object.values(by).filter(g=>g.c&&(show!=="ev"&&g.vac.length||show!=="vac"&&g.ev.length)).map(g=>({g,d:km(me,g.c)})).sort((a,b)=>a.d-b.d).slice(0,5);
    if(!gs.length){box.append(el("p","hint","Рядом пока ничего нет. Посмотри удалёнку: ")); const a=el("a",null,"вакансии удалённо →");a.href="./?remote=1";box.lastChild.append(a);return}
    box.append(el("p","hint","Ближе всего к тебе (по городам, расстояние по прямой):"));
    for(const {g,d} of gs){
      const a=el("a");a.href=show==="ev"||!g.vac.length?"events.html":"./?city="+encodeURIComponent(g.name);
      const parts=[];if(show!=="ev"&&g.vac.length)parts.push(g.vac.length+" "+word(g.vac.length,"вакансия","вакансии","вакансий"));if(show!=="vac"&&g.ev.length)parts.push(g.ev.length+" "+word(g.ev.length,"смена/событие","смены/события","смен/событий"));
      a.append(el("span",null,g.name+" — "+parts.join(", ")),el("small",null,d<3?"твой город":"≈ "+Math.round(d)+" км"));box.append(a);
    }
  }
  document.querySelectorAll("#tools [data-show]").forEach(b=>b.onclick=()=>{show=b.dataset.show;document.querySelectorAll("#tools [data-show]").forEach(x=>x.setAttribute("aria-pressed",x===b));draw();fit();if(me)nearList()});
  const nb=document.getElementById("nearBtn");
  function locate(){
    if(!navigator.geolocation){NR.toast("Браузер не умеет определять место — выбери город ниже.");return}
    nb.disabled=true;nb.textContent="📍 Ищу тебя…";
    navigator.geolocation.getCurrentPosition(p=>{
      nb.disabled=false;nb.textContent="📍 Рядом со мной";nb.setAttribute("aria-pressed","true");
      me=[p.coords.latitude,p.coords.longitude];
      if(hasMap){if(window._me)window._me.remove();window._me=L.marker(me,{icon:L.divIcon({className:"",html:'<div class="me"></div>',iconSize:[18,18]}),title:"Ты здесь"}).addTo(map).bindPopup("Ты здесь")}
      nearList();fit();
    },()=>{nb.disabled=false;nb.textContent="📍 Рядом со мной";NR.toast("Не получилось узнать, где ты. Разреши доступ к месту или выбери город ниже.")},{enableHighAccuracy:false,timeout:12000,maximumAge:600000});
  }
  nb.onclick=locate;
  (async()=>{
    const sum=document.getElementById("sum");
    if(!sb){sum.textContent="Сайт не подключён к базе.";return}
    const today=NR.today();
    let {data,error}=await sb.from("vacancies").select("id,title,city,remote,pay,age_min,expires_at").eq("status","approved").order("created_at",{ascending:false}).limit(1000);
    if(error)({data}=await sb.from("vacancies").select("id,title,city,remote,pay,age_min").eq("status","approved").limit(1000));
    const rows=(data||[]).filter(v=>!v.expires_at||v.expires_at>=today);
    // смены и мероприятия: только опубликованные в общем списке и ещё не прошедшие (как на странице events.html)
    const er=await sb.from("events").select("id,title,starts_at,place,city,kind,listed").gte("starts_at",new Date().toISOString()).order("starts_at").limit(300);
    const evs=(er.data||[]).filter(e=>e.listed!==false&&e.city);
    for(const v of rows){if(!v.city){if(v.remote)remote++;continue}const g=group(v.city);g.vac.push(v);if(!g.c)unknown++}
    for(const e of evs){const g=group(e.city);g.ev.push(e)}
    draw();fit();
    const ne=evs.length;
    sum.textContent=rows.length||ne?("Сейчас "+rows.length+" "+word(rows.length,"вакансия","вакансии","вакансий")+(remote?" (из них "+remote+" удалённо)":"")+(ne?" и "+ne+" "+word(ne,"смена или мероприятие","смены и мероприятия","смен и мероприятий"):"")+". Синие кружки — вакансии, зелёные — смены и мероприятия. Нажми на кружок, чтобы увидеть, что там есть."):"Пока вакансий нет — загляни позже.";
    const cs=document.getElementById("cities");
    Object.values(by).sort((a,b)=>(b.vac.length+b.ev.length)-(a.vac.length+a.ev.length)).forEach(g=>{const a=el("a","chip",g.name+" · "+[g.vac.length?g.vac.length+"":"",g.ev.length?"🟢 "+g.ev.length:""].filter(Boolean).join(" + "));a.href=g.vac.length?"./?city="+encodeURIComponent(g.name):"events.html";a.style.textDecoration="none";cs.append(a)});
    if(remote){const a=el("a","chip","Удалённо · "+remote);a.href="./?remote=1";a.style.textDecoration="none";cs.append(a)}
    if(/[?&]near=1/.test(location.search))locate();
  })();
})();
</script>
</body>
</html>
