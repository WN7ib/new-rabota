name: db

# Применяет SQL-миграции к базе Supabase (их можно запускать повторно).
# Нужен секрет SUPABASE_ACCESS_TOKEN (тот же, что для бота). Без него — просто предупреждение.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["migration-*.sql", ".github/workflows/db.yml"]

env:
  PROJECT_REF: htachxunemajeawnbccy

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Миграции
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Нет секрета SUPABASE_ACCESS_TOKEN — миграции не применены. Добавь его или выполни migration-3.sql и migration-5.sql вручную в Supabase → SQL Editor."
            exit 0
          fi
          for f in migration-2-admin.sql migration-3.sql migration-4-bot.sql migration-5.sql migration-6.sql migration-7.sql; do
            [ -f "$f" ] || continue
            jq -Rs '{query: .}' "$f" > /tmp/q.json
            code=$(curl -s -o /tmp/r.txt -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json)
            echo "$f → HTTP $code"; head -c 400 /tmp/r.txt; echo
            [ "$code" -lt 300 ] || { echo "::error::База не приняла $f"; exit 1; }
          done
