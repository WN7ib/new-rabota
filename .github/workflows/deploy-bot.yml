name: deploy-bot

# Бот New.работа на сервере Supabase: база → функция → секреты → webhook Telegram.
# Нужны секреты репозитория (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN — supabase.com/dashboard/account/tokens → Generate new token
#   TG_BOT_TOKEN          — токен рабочего бота New.работа из @BotFather
#   TG_OWNER_ID           — (необязательно) твой Telegram id; иначе его запишет мессенджер Newi

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["supabase/**", "migration-4-bot.sql", ".github/workflows/deploy-bot.yml"]

env:
  PROJECT_REF: htachxunemajeawnbccy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверка секретов
        env:
          SAT: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TGT: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          if [ -z "$SAT" ] || [ -z "$TGT" ]; then
            echo "::error::Добавь секреты SUPABASE_ACCESS_TOKEN и TG_BOT_TOKEN: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Таблицы бота в базе
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          jq -Rs '{query: .}' migration-4-bot.sql > /tmp/q.json
          code=$(curl -s -o /tmp/r.txt -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json)
          echo "HTTP $code"; head -c 500 /tmp/r.txt; echo
          [ "$code" -lt 300 ] || { echo "::error::База не приняла migration-4-bot.sql — выполни его вручную в Supabase → SQL Editor"; exit 1; }

      - name: Функция бота
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy tg-bot --project-ref "$PROJECT_REF" --no-verify-jwt --use-api

      - name: Секреты функции
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          TGT: ${{ secrets.TG_BOT_TOKEN }}
          OWN: ${{ secrets.TG_OWNER_ID }}
        run: |
          args="TG_TOKEN=$TGT"
          [ -n "$OWN" ] && args="$args OWNER_ID=$OWN"
          supabase secrets set $args --project-ref "$PROJECT_REF"

      - name: Webhook Telegram
        env:
          TGT: ${{ secrets.TG_BOT_TOKEN }}
        run: |
          SECRET=$(printf %s "$TGT" | sha256sum | cut -c1-32)
          curl -s "https://api.telegram.org/bot$TGT/setWebhook" \
            --data-urlencode "url=https://$PROJECT_REF.supabase.co/functions/v1/tg-bot" \
            --data-urlencode "secret_token=$SECRET" \
            --data-urlencode 'allowed_updates=["message","callback_query"]' \
            --data-urlencode "drop_pending_updates=false"; echo
          curl -s "https://api.telegram.org/bot$TGT/setMyCommands" -H 'Content-Type: application/json' \
            -d '{"commands":[{"command":"start","description":"Меню"},{"command":"find","description":"Найти работу"},{"command":"add_job","description":"Разместить вакансию"},{"command":"help","description":"Что умеет бот"}]}'; echo
          curl -s "https://api.telegram.org/bot$TGT/getWebhookInfo"; echo
